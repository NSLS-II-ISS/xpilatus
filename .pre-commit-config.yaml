repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (Pixi)
        entry: pixi run lint
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: Ruff format check (Pixi)
        entry: pixi run format-check
        language: system
        pass_filenames: false
        types: [python]
