name: Documentation
on: [push, pull_request]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.71.3
          locked: true
      - run: pixi run docs
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/html/
